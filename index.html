<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-4">

    <!-- هدر با دکمه‌ها -->
    <header class="fixed top-0 left-0 w-full bg-gray-900 p-4 z-50 shadow-lg">
        <div class="flex space-x-4 justify-center">
            <button onclick="setLanguage('html')" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">HTML</button>
            <button onclick="setLanguage('css')" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">CSS</button>
            <button onclick="setLanguage('javascript')" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">JS</button>
            <button onclick="saveCode()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">💾 ذخیره کد</button>
            <button onclick="openCodeInNewWindow()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">🚀 باز کردن کد در صفحه جدید</button>
            <button onclick="togglePreview()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">📱 نمایش/مخفی کردن پیش‌نمایش</button>
            <button onclick="toggleTheme()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">🌙 تغییر تم</button>
            <button onclick="increaseFontSize()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">➕ افزایش فونت</button>
            <button onclick="decreaseFontSize()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">➖ کاهش فونت</button>
            <button onclick="undo()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">↩️ Undo</button>
            <button onclick="redo()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">↪️ Redo</button>
            <button onclick="openFind()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">🔍 جستجو</button>
            <button onclick="openReplace()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors duration-200">🔧 جایگزینی</button>
        </div>
    </header>

    <!-- عنوان صفحه -->
    <center><h1 class="text-3xl font-extrabold mb-6 mt-20">کد ادیتور تحت وب</h1></center>

    <!-- قاب ویرایشگر -->
    <div class="w-[90%] md:w-[90%] lg:w-[90%] h-[80vh] flex border border-gray-700 rounded-xl overflow-hidden shadow-2xl bg-black">
        
        <!-- بخش ویرایشگر -->
        <div id="editor-container" class="w-full flex flex-col bg-black p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-white">ویرایشگر کد</h2>
                <div class="flex space-x-2">
                    <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                    <span class="w-3 h-3 bg-yellow-500 rounded-full"></span>
                    <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                </div>
            </div>
            <div id="editor" class="h-full rounded-lg overflow-hidden"></div>
        </div>

        <!-- بخش پیش نمایش -->
        <div id="preview-container" class="w-1/3 bg-white border-l border-gray-400 flex flex-col items-center justify-center p-4">
            <div class="mobile-frame">
                <iframe id="preview" class="w-full h-full border-none rounded-xl shadow-md"></iframe>
            </div>
        </div>

    </div>
    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <h2>tech_team</h2>
        <p>create by default</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emmet-monaco-editor@latest/dist/emmet-monaco.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
